<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pupil</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#videoContainer {
  position: relative;
  width: 240px;
  height: 320px;
}

video, canvas.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#irisGuide {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120px;
  height: 120px;
  border: 2px solid cyan;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

canvas.result {
  width: 150px;
  height: 200px;
  border: 1px solid #444;
  margin: 4px;
}
</style>
</head>

<body>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay" class="overlay"></canvas>
  <div id="irisGuide"></div>
</div>

<div>
  <button onclick="toggleCamera()">Switch Camera</button>
  <button onclick="runTest()">Measure</button>
</div>

<div>
  <canvas id="baselineCanvas" class="result" width="240" height="320"></canvas>
  <canvas id="minCanvas" class="result" width="240" height="320"></canvas>
</div>

<div id="results"></div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
let stream, useFront=false;

window.onload = async () => {
  await initCamera();
  requestAnimationFrame(liveDetect);
};

async function initCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());

  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode: useFront ? "user" : {ideal:"environment"} }
  });

  video.srcObject = stream;
  video.style.transform = useFront ? "scaleX(-1)" : "none";
}

function toggleCamera(){
  useFront=!useFront;
  initCamera();
}

// ---------- FRAME ----------
function captureFrame(){
  const c=procCanvas;
  const ctx=c.getContext("2d");

  c.width=240; c.height=320;

  const vw=video.videoWidth;
  const vh=video.videoHeight;

  const scale=Math.max(c.width/vw,c.height/vh);
  const sw=c.width/scale;
  const sh=c.height/scale;
  const sx=(vw-sw)/2;
  const sy=(vh-sh)/2;

  ctx.drawImage(video,sx,sy,sw,sh,0,0,c.width,c.height);
  return ctx.getImageData(0,0,c.width,c.height);
}

// ---------- PROCESS ----------
function toGray(frame){
  const g=new Float32Array(frame.width*frame.height);
  const d=frame.data;
  for(let i=0,j=0;i<d.length;i+=4,j++){
    g[j]=(d[i]+d[i+1]+d[i+2])/3;
  }
  return g;
}

function sobel(gray,w,h){
  const out=new Float32Array(w*h);

  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const i=y*w+x;

      const gx =
        -gray[i-w-1]-2*gray[i-1]-gray[i+w-1]+
         gray[i-w+1]+2*gray[i+1]+gray[i+w+1];

      const gy =
        -gray[i-w-1]-2*gray[i-w]-gray[i-w+1]+
         gray[i+w-1]+2*gray[i+w]+gray[i+w+1];

      out[i]=Math.sqrt(gx*gx+gy*gy);
    }
  }
  return out;
}

// ---------- GUIDE ROI ----------
function getGuideCircle(){
  return {
    cx: 120,
    cy: 160,
    r: 60
  };
}

// ---------- ROI-CONSTRAINED HOUGH ----------
function houghCircleROI(edges,w,h,cx,cy,minR,maxR,roiR){

  let best=null, bestScore=0;

  for(let r=minR;r<maxR;r+=2){

    let score=0;

    for(let a=0;a<360;a+=8){
      const rad=a*Math.PI/180;

      const x=Math.round(cx+r*Math.cos(rad));
      const y=Math.round(cy+r*Math.sin(rad));

      if(x<0||y<0||x>=w||y>=h) continue;

      // enforce ROI
      const dx=x-cx;
      const dy=y-cy;
      if(Math.sqrt(dx*dx+dy*dy) > roiR) continue;

      if(edges[y*w+x] > 100) score++;
    }

    if(score > bestScore){
      bestScore = score;
      best = {cx,cy,r};
    }
  }

  return best;
}

// ---------- DETECT ----------
function detect(frame){

  const w=frame.width, h=frame.height;

  const gray=toGray(frame);
  const edges=sobel(gray,w,h);

  const guide=getGuideCircle();

  // IRIS: tightly constrained to guide circle
  const iris = {
    cx: guide.cx,
    cy: guide.cy,
    r: guide.r
  };

  // PUPIL: constrained inside iris
  const pupil = houghCircleROI(
    edges,
    w,
    h,
    iris.cx,
    iris.cy,
    8,
    iris.r * 0.6,
    iris.r
  );

  return {edges, iris, pupil};
}

// ---------- DRAW ----------
function drawDebug(canvas,data){
  const ctx=canvas.getContext("2d");

  const img=ctx.createImageData(240,320);

  for(let i=0;i<data.edges.length;i++){
    const v=data.edges[i];
    const val=Math.min(255,v*2);

    img.data[i*4]=val;
    img.data[i*4+1]=val;
    img.data[i*4+2]=val;
    img.data[i*4+3]=255;
  }

  ctx.putImageData(img,0,0);

  // iris (yellow)
  ctx.beginPath();
  ctx.arc(data.iris.cx,data.iris.cy,data.iris.r,0,2*Math.PI);
  ctx.strokeStyle="yellow";
  ctx.stroke();

  // pupil (cyan)
  if(data.pupil){
    ctx.beginPath();
    ctx.arc(data.pupil.cx,data.pupil.cy,data.pupil.r,0,2*Math.PI);
    ctx.strokeStyle="cyan";
    ctx.stroke();
  }
}

// ---------- LIVE ----------
function liveDetect(){
  const f=captureFrame();
  const d=detect(f);

  const ctx=overlay.getContext("2d");
  ctx.clearRect(0,0,240,320);

  if(d.pupil){
    ctx.beginPath();
    ctx.arc(d.pupil.cx,d.pupil.cy,d.pupil.r,0,2*Math.PI);
    ctx.strokeStyle="cyan";
    ctx.stroke();
  }

  requestAnimationFrame(liveDetect);
}

// ---------- TEST ----------
async function runTest(){

  let frames=[],vals=[];

  for(let i=0;i<6;i++){
    let f=captureFrame();
    let d=detect(f);
    frames.push(d);
    vals.push(d.pupil?d.pupil.r:null);
    await new Promise(r=>setTimeout(r,80));
  }

  await flash();

  for(let i=0;i<15;i++){
    let f=captureFrame();
    let d=detect(f);
    frames.push(d);
    vals.push(d.pupil?d.pupil.r:null);
    await new Promise(r=>setTimeout(r,80));
  }

  let minVal=Infinity,minIndex=-1;

  for(let i=6;i<vals.length;i++){
    if(vals[i]!==null && vals[i]<minVal){
      minVal=vals[i];
      minIndex=i;
    }
  }

  drawDebug(baselineCanvas,frames[0]);
  drawDebug(minCanvas,frames[minIndex]);

  let baseline=vals[0];
  let constriction=((baseline-minVal)/baseline)*100;

  results.innerHTML =
    `Dilated: ${baseline.toFixed(1)} px<br>
     Constricted: ${minVal.toFixed(1)} px<br>
     Constriction: ${constriction.toFixed(1)}%`;
}

// ---------- FLASH ----------
async function flash(){
  document.body.style.background="#fff";
  await new Promise(r=>setTimeout(r,200));
  document.body.style.background="#111";
}
</script>

</body>
</html>
