<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pupil</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#videoContainer {
  position: relative;
  width: 240px;
  height: 320px;
}

video, canvas.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#irisGuide {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120px;
  height: 120px;
  border: 2px solid cyan;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

canvas.result {
  width: 150px;
  height: 200px;
  border: 1px solid #444;
  margin: 4px;
}

button {
  margin: 6px;
  padding: 8px;
}
</style>
</head>

<body>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay" class="overlay"></canvas>
  <div id="irisGuide"></div>
</div>

<div>
  <button onclick="toggleCamera()">Switch Camera</button>
  <button onclick="runTest()">Measure</button>
</div>

<div>
  <canvas id="baselineCanvas" class="result" width="240" height="320"></canvas>
  <canvas id="minCanvas" class="result" width="240" height="320"></canvas>
</div>

<div id="results"></div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
let stream, useFront=false;

window.onload = async () => {
  await initCamera();
  requestAnimationFrame(liveDetect);
};

async function initCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());

  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode: useFront ? "user" : {ideal:"environment"} }
  });

  video.srcObject = stream;
  video.style.transform = useFront ? "scaleX(-1)" : "none";
}

function toggleCamera(){
  useFront=!useFront;
  initCamera();
}

// ---------- FRAME ----------
function captureFrame(){
  const c=procCanvas;
  const ctx=c.getContext("2d");

  c.width=240; c.height=320;

  const vw=video.videoWidth;
  const vh=video.videoHeight;

  const scale=Math.max(c.width/vw,c.height/vh);
  const sw=c.width/scale;
  const sh=c.height/scale;
  const sx=(vw-sw)/2;
  const sy=(vh-sh)/2;

  ctx.drawImage(video,sx,sy,sw,sh,0,0,c.width,c.height);
  return ctx.getImageData(0,0,c.width,c.height);
}

// ---------- GRADIENT ----------
function computeGradient(frame){

  const w=frame.width, h=frame.height;
  const d=frame.data;

  const gray=new Float32Array(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    gray[j]=(d[i]+d[i+1]+d[i+2])/3;
  }

  const gx=new Float32Array(w*h);
  const gy=new Float32Array(w*h);
  const mag=new Float32Array(w*h);

  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){

      const i=y*w+x;

      const sx =
        -gray[i-w-1]-2*gray[i-1]-gray[i+w-1]+
         gray[i-w+1]+2*gray[i+1]+gray[i+w+1];

      const sy =
        -gray[i-w-1]-2*gray[i-w]-gray[i-w+1]+
         gray[i+w-1]+2*gray[i+w]+gray[i+w+1];

      gx[i]=sx;
      gy[i]=sy;
      mag[i]=Math.sqrt(sx*sx+sy*sy);
    }
  }

  return {gx,gy,mag};
}

// ---------- GUIDE ----------
function getGuideCircle(){

  const rect = video.getBoundingClientRect();
  const guide = irisGuide.getBoundingClientRect();

  const scaleX = 240 / rect.width;
  const scaleY = 320 / rect.height;

  return {
    cx: (guide.left - rect.left + guide.width/2) * scaleX,
    cy: (guide.top - rect.top + guide.height/2) * scaleY,
    r: (guide.width/2) * scaleX
  };
}

// ---------- DIRECTIONAL HOUGH ----------
function detect(frame){

  const w=frame.width, h=frame.height;

  const {gx,gy,mag} = computeGradient(frame);
  const guide = getGuideCircle();

  const iris = guide;

  let bestR=0;
  let bestScore=0;

  for(let r=6; r<iris.r*0.6; r+=1){

    let score=0;

    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){

        const i=y*w+x;

        if(mag[i] < 60) continue;

        const dx=x-iris.cx;
        const dy=y-iris.cy;

        // must be inside iris
        if(dx*dx+dy*dy > iris.r*iris.r) continue;

        // gradient direction
        const gxn=gx[i];
        const gyn=gy[i];

        const len=Math.sqrt(gxn*gxn+gyn*gyn);
        if(len===0) continue;

        const nx=gxn/len;
        const ny=gyn/len;

        // expected circle normal direction
        const ex=dx/Math.sqrt(dx*dx+dy*dy);
        const ey=dy/Math.sqrt(dx*dx+dy*dy);

        const dot = nx*ex + ny*ey;

        // alignment check
        if(dot > 0.8){

          const dist = Math.sqrt(dx*dx+dy*dy);

          if(Math.abs(dist - r) < 2){
            score++;
          }
        }
      }
    }

    if(score > bestScore){
      bestScore = score;
      bestR = r;
    }
  }

  return {
    iris,
    pupil: bestScore > 50 ? {cx:iris.cx, cy:iris.cy, r:bestR} : null,
    mag
  };
}

// ---------- DRAW ----------
function drawDebug(canvas,data){

  const ctx=canvas.getContext("2d");
  const img=ctx.createImageData(240,320);

  for(let i=0;i<data.mag.length;i++){
    const v=Math.min(255,data.mag[i]*2);
    img.data[i*4]=v;
    img.data[i*4+1]=v;
    img.data[i*4+2]=v;
    img.data[i*4+3]=255;
  }

  ctx.putImageData(img,0,0);

  // iris
  ctx.beginPath();
  ctx.arc(data.iris.cx,data.iris.cy,data.iris.r,0,2*Math.PI);
  ctx.strokeStyle="yellow";
  ctx.stroke();

  // pupil
  if(data.pupil){
    ctx.beginPath();
    ctx.arc(data.pupil.cx,data.pupil.cy,data.pupil.r,0,2*Math.PI);
    ctx.strokeStyle="cyan";
    ctx.stroke();
  }
}

// ---------- LIVE ----------
function liveDetect(){
  const f=captureFrame();
  const d=detect(f);

  const ctx=overlay.getContext("2d");
  ctx.clearRect(0,0,240,320);

  ctx.beginPath();
  ctx.arc(d.iris.cx,d.iris.cy,d.iris.r,0,2*Math.PI);
  ctx.strokeStyle="yellow";
  ctx.stroke();

  if(d.pupil){
    ctx.beginPath();
    ctx.arc(d.pupil.cx,d.pupil.cy,d.pupil.r,0,2*Math.PI);
    ctx.strokeStyle="cyan";
    ctx.stroke();
  }

  requestAnimationFrame(liveDetect);
}

// ---------- FLASH ----------
async function flash(){
  document.body.style.background="#fff";
  await new Promise(r=>setTimeout(r,200));
  document.body.style.background="#111";
}

// ---------- TEST ----------
async function runTest(){

  let frames=[],vals=[];

  for(let i=0;i<6;i++){
    let d=detect(captureFrame());
    frames.push(d);
    vals.push(d.pupil?d.pupil.r:null);
    await new Promise(r=>setTimeout(r,80));
  }

  await flash();

  for(let i=0;i<15;i++){
    let d=detect(captureFrame());
    frames.push(d);
    vals.push(d.pupil?d.pupil.r:null);
    await new Promise(r=>setTimeout(r,80));
  }

  let minVal=Infinity,minIndex=-1;

  for(let i=6;i<vals.length;i++){
    if(vals[i]!==null && vals[i]<minVal){
      minVal=vals[i];
      minIndex=i;
    }
  }

  drawDebug(baselineCanvas,frames[0]);
  drawDebug(minCanvas,frames[minIndex]);

  let baseline=vals[0];
  let constriction=((baseline-minVal)/baseline)*100;

  results.innerHTML =
    `Dilated: ${baseline.toFixed(1)} px<br>
     Constricted: ${minVal.toFixed(1)} px<br>
     Constriction: ${constriction.toFixed(1)}%`;
}
</script>

</body>
</html>
