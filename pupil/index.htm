<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pupil Response</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

#videoContainer {
  position: relative;
  width: 240px;
  height: 320px;
  overflow: hidden;
  border-radius: 10px;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#irisGuide {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120px;
  height: 120px;
  border: 2px solid cyan;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

#row {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}

canvas {
  width: 150px;
  height: 200px;
  border: 1px solid #444;
}

button {
  margin: 6px;
  padding: 8px;
}

#results {
  margin-top: 8px;
  font-size: 13px;
  text-align: center;
  line-height: 1.4;
}

#status {
  font-size: 12px;
  margin-top: 4px;
}
</style>
</head>

<body>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
  <div id="irisGuide"></div>
</div>

<div>
  <button onclick="startCamera()">Start</button>
  <button onclick="runTest()">Measure</button>
</div>

<div id="row">
  <canvas id="baselineCanvas" width="240" height="320"></canvas>
  <canvas id="minCanvas" width="240" height="320"></canvas>
</div>

<div id="results">
  Dilated: —<br>
  Constricted: —<br>
  Constriction: —<br>
  Briskness: —
</div>

<div id="status">Align iris and press Measure</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
let stream, track;

async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" } }
  });

  video.srcObject = stream;
  track = stream.getVideoTracks()[0];
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function captureFrame(){
  const c = document.getElementById("procCanvas");
  const ctx = c.getContext("2d");

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  c.width = 240;
  c.height = 320;

  const scale = Math.max(c.width/vw, c.height/vh);
  const sw = c.width/scale;
  const sh = c.height/scale;
  const sx = (vw-sw)/2;
  const sy = (vh-sh)/2;

  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);

  return ctx.getImageData(0,0,c.width,c.height);
}

function detect(frame){
  const data = frame.data;
  const w = frame.width;
  const h = frame.height;

  const cx = w/2;
  const cy = h/2;
  const rSearch = 50;

  let sumX=0,sumY=0,count=0;

  for(let y=cy-rSearch;y<cy+rSearch;y++){
    for(let x=cx-rSearch;x<cx+rSearch;x++){
      if(x<0||y<0||x>=w||y>=h) continue;

      const i=(y*w+x)*4;
      const b=(data[i]+data[i+1]+data[i+2])/3;

      if(b<60){
        sumX+=x; sumY+=y; count++;
      }
    }
  }

  if(count<50) return null;

  return {
    cx: sumX/count,
    cy: sumY/count,
    r: Math.sqrt(count/Math.PI)
  };
}

function draw(canvas, frame, res){
  const ctx = canvas.getContext("2d");
  ctx.putImageData(frame,0,0);

  if(!res) return;

  ctx.beginPath();
  ctx.arc(res.cx,res.cy,res.r,0,2*Math.PI);
  ctx.strokeStyle="cyan";
  ctx.lineWidth=2;
  ctx.stroke();
}

async function flash(){
  try{
    const caps = track.getCapabilities();
    if(caps.torch){
      await track.applyConstraints({advanced:[{torch:true}]});
      await sleep(200);
      await track.applyConstraints({advanced:[{torch:false}]});
      return;
    }
  }catch{}

  document.body.style.background="#fff";
  await sleep(200);
  document.body.style.background="#111";
}

async function runTest(){

  let frames=[], vals=[], times=[];

  for(let i=0;i<6;i++){
    let f=captureFrame();
    let r=detect(f);
    frames.push({f,r});
    vals.push(r?r.r:0);
    times.push(performance.now());
    await sleep(80);
  }

  await flash();

  for(let i=0;i<15;i++){
    let f=captureFrame();
    let r=detect(f);
    frames.push({f,r});
    vals.push(r?r.r:0);
    times.push(performance.now());
    await sleep(80);
  }

  let minIndex = vals.indexOf(Math.min(...vals));

  let baseline = vals[0];
  let minVal = vals[minIndex];

  draw(document.getElementById("baselineCanvas"), frames[0].f, frames[0].r);
  draw(document.getElementById("minCanvas"), frames[minIndex].f, frames[minIndex].r);

  let constriction = ((baseline-minVal)/baseline)*100;

  // briskness = slope (pixels/ms)
  let dt = times[minIndex]-times[0];
  let slope = (baseline-minVal)/dt;

  let brisk = slope > 0.02 ? "Brisk" : "Sluggish";

  document.getElementById("results").innerHTML =
    `Dilated: ${baseline.toFixed(1)} px<br>
     Constricted: ${minVal.toFixed(1)} px<br>
     Constriction: ${constriction.toFixed(1)}%<br>
     Briskness: ${brisk}`;
}
</script>

</body>
</html>
