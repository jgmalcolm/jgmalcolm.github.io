<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pupil Response</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

#videoContainer {
  position: relative;
}

video {
  width: 60vw;
  max-width: 240px;
  border-radius: 8px;
}

#irisGuide {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120px;
  height: 120px;
  border: 2px solid cyan;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

canvas {
  width: 40vw;
  max-width: 160px;
  margin: 4px;
  border: 1px solid #444;
}

#row {
  display: flex;
}

button {
  margin: 4px;
  padding: 8px;
}

#status {
  font-size: 12px;
  text-align: center;
}
</style>
</head>

<body>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
  <div id="irisGuide"></div>
</div>

<div>
  <button onclick="startCamera()">Start</button>
  <button onclick="runTest()">Measure</button>
</div>

<div id="row">
  <canvas id="baselineCanvas"></canvas>
  <canvas id="minCanvas"></canvas>
</div>

<div id="status">Align iris with circle, then press Measure</div>

<canvas id="hidden" style="display:none;"></canvas>

<script>
let stream, track;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }
    });

    video.srcObject = stream;
    track = stream.getVideoTracks()[0];

    document.getElementById("status").innerText =
      "Align iris with circle, then press Measure";

  } catch (e) {
    document.getElementById("status").innerText =
      "Camera error: " + e.message;
  }
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function detectPupil(frame, w, h) {
  const data = frame.data;

  const cx = w / 2;
  const cy = h / 2;

  const irisRadius = Math.min(w, h) * 0.18;
  const searchRadius = irisRadius * 0.6;

  let sumX = 0, sumY = 0, count = 0;

  for (let y = cy - searchRadius; y < cy + searchRadius; y++) {
    for (let x = cx - searchRadius; x < cx + searchRadius; x++) {

      if (x < 0 || y < 0 || x >= w || y >= h) continue;

      const dx = x - cx;
      const dy = y - cy;

      if (Math.sqrt(dx*dx + dy*dy) > searchRadius) continue;

      const i = (y*w + x)*4;
      const b = (data[i] + data[i+1] + data[i+2]) / 3;

      if (b < 60) {
        sumX += x;
        sumY += y;
        count++;
      }
    }
  }

  if (count < 50) return null;

  return {
    cx: sumX / count,
    cy: sumY / count,
    r: Math.sqrt(count / Math.PI)
  };
}

function draw(frame, res, canvas) {
  const ctx = canvas.getContext("2d");
  ctx.putImageData(frame, 0, 0);

  if (!res) return;

  ctx.beginPath();
  ctx.arc(res.cx, res.cy, res.r, 0, 2 * Math.PI);

  ctx.strokeStyle = "cyan";
  ctx.lineWidth = 2;
  ctx.stroke();
}

async function flash() {
  if (!track) return;

  const capabilities = track.getCapabilities();

  if (capabilities.torch) {
    try {
      await track.applyConstraints({ advanced: [{ torch: true }] });
      await sleep(200);
      await track.applyConstraints({ advanced: [{ torch: false }] });
      return;
    } catch {}
  }

  // fallback flash
  document.body.style.background = "#fff";
  await sleep(200);
  document.body.style.background = "#111";
}

async function runTest() {

  const hidden = document.getElementById("hidden");
  const ctx = hidden.getContext("2d");

  hidden.width = video.videoWidth;
  hidden.height = video.videoHeight;

  let frames = [];
  let values = [];

  // baseline
  for (let i = 0; i < 6; i++) {
    ctx.drawImage(video, 0, 0);
    let f = ctx.getImageData(0, 0, hidden.width, hidden.height);
    let res = detectPupil(f, hidden.width, hidden.height);

    frames.push({f, res});
    values.push(res ? res.r : 0);

    await sleep(80);
  }

  await flash();

  // response
  for (let i = 0; i < 15; i++) {
    ctx.drawImage(video, 0, 0);
    let f = ctx.getImageData(0, 0, hidden.width, hidden.height);
    let res = detectPupil(f, hidden.width, hidden.height);

    frames.push({f, res});
    values.push(res ? res.r : 0);

    await sleep(80);
  }

  let minIndex = values.indexOf(Math.min(...values));

  draw(frames[0].f, frames[0].res,
       document.getElementById("baselineCanvas"));

  draw(frames[minIndex].f, frames[minIndex].res,
       document.getElementById("minCanvas"));

  let baseline = values[0];
  let minVal = values[minIndex];

  let constriction = ((baseline - minVal) / baseline) * 100;

  document.getElementById("status").innerText =
    `Baseline: ${baseline.toFixed(1)} | Min: ${minVal.toFixed(1)} | Constriction: ${constriction.toFixed(1)}%`;
}
</script>

</body>
</html>
