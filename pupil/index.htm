<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pupil</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

#videoContainer {
  position: relative;
  width: 240px;
  height: 320px;
  overflow: hidden;
  border-radius: 10px;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1); /* mirror for usability */
}

#irisGuide {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120px;
  height: 120px;
  border: 2px solid cyan;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

#row {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}

canvas {
  width: 150px;
  height: 200px;
  border: 1px solid #444;
}

button {
  margin: 6px;
  padding: 8px;
}

#results {
  margin-top: 8px;
  font-size: 13px;
  text-align: center;
}

#status {
  font-size: 12px;
}
</style>
</head>

<body>

<div id="videoContainer">
  <video id="video" autoplay playsinline></video>
  <div id="irisGuide"></div>
</div>

<div>
  <button onclick="startCamera()">Start</button>
  <button onclick="runTest()">Measure</button>
</div>

<div id="row">
  <canvas id="baselineCanvas" width="240" height="320"></canvas>
  <canvas id="minCanvas" width="240" height="320"></canvas>
</div>

<div id="results">—</div>
<div id="status">Align iris and press Measure</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
let stream;

async function startCamera(){
  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode: "user" }
  });
  video.srcObject = stream;
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function captureFrame(){
  const c = document.getElementById("procCanvas");
  const ctx = c.getContext("2d");

  c.width = 240;
  c.height = 320;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const scale = Math.max(c.width/vw, c.height/vh);
  const sw = c.width/scale;
  const sh = c.height/scale;
  const sx = (vw-sw)/2;
  const sy = (vh-sh)/2;

  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);

  return ctx.getImageData(0,0,c.width,c.height);
}

// ---------- IMAGE PROCESSING ----------

function toGray(frame){
  const g = new Float32Array(frame.width * frame.height);
  const d = frame.data;
  for(let i=0,j=0;i<d.length;i+=4,j++){
    g[j]=(d[i]+d[i+1]+d[i+2])/3;
  }
  return g;
}

function sobel(gray,w,h){
  const out = new Float32Array(w*h);

  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){

      const i=y*w+x;

      const gx =
        -gray[i-w-1]-2*gray[i-1]-gray[i+w-1] +
         gray[i-w+1]+2*gray[i+1]+gray[i+w+1];

      const gy =
        -gray[i-w-1]-2*gray[i-w]-gray[i-w+1] +
         gray[i+w-1]+2*gray[i+w]+gray[i+w+1];

      out[i]=Math.sqrt(gx*gx+gy*gy);
    }
  }

  return out;
}

// ---------- HOUGH ----------

function detectPupil(frame){

  const w=frame.width;
  const h=frame.height;

  const gray=toGray(frame);
  const edges=sobel(gray,w,h);

  const cx=w/2;
  const cy=h/2;

  const irisR=Math.min(w,h)*0.25;
  const minR=irisR*0.15;
  const maxR=irisR*0.5;

  let best=null;
  let bestScore=0;

  for(let r=minR;r<maxR;r+=2){

    let score=0;

    for(let a=0;a<360;a+=10){
      const rad=a*Math.PI/180;
      const x=Math.round(cx+r*Math.cos(rad));
      const y=Math.round(cy+r*Math.sin(rad));

      if(x<1||y<1||x>=w-1||y>=h-1) continue;

      const i=y*w+x;
      if(edges[i]>80) score++;
    }

    if(score>bestScore){
      bestScore=score;
      best={cx,cy,r};
    }
  }

  return best;
}

function draw(canvas,frame,res){
  const ctx=canvas.getContext("2d");
  ctx.putImageData(frame,0,0);

  if(!res) return;

  ctx.beginPath();
  ctx.arc(res.cx,res.cy,res.r,0,2*Math.PI);
  ctx.strokeStyle="cyan";
  ctx.lineWidth=2;
  ctx.stroke();
}

async function flash(){
  document.body.style.background="#fff";
  await sleep(200);
  document.body.style.background="#111";
}

async function runTest(){

  let frames=[],vals=[],times=[];

  for(let i=0;i<6;i++){
    let f=captureFrame();
    let r=detectPupil(f);
    frames.push({f,r});
    vals.push(r?r.r:null);
    times.push(performance.now());
    await sleep(80);
  }

  await flash();

  for(let i=0;i<15;i++){
    let f=captureFrame();
    let r=detectPupil(f);
    frames.push({f,r});
    vals.push(r?r.r:null);
    times.push(performance.now());
    await sleep(80);
  }

  let baselineIndex=vals.findIndex(v=>v!==null);

  let minVal=Infinity,minIndex=-1;

  for(let i=6;i<vals.length;i++){
    if(vals[i]!==null && vals[i]<minVal){
      minVal=vals[i];
      minIndex=i;
    }
  }

  if(baselineIndex===-1||minIndex===-1){
    document.getElementById("status").innerText="Detection failed";
    return;
  }

  let baseline=vals[baselineIndex];

  draw(document.getElementById("baselineCanvas"),
       frames[baselineIndex].f,
       frames[baselineIndex].r);

  draw(document.getElementById("minCanvas"),
       frames[minIndex].f,
       frames[minIndex].r);

  let constriction=((baseline-minVal)/baseline)*100;

  let dt=times[minIndex]-times[baselineIndex];
  let slope=(baseline-minVal)/dt;

  let brisk=slope>0.02?"Brisk":"Sluggish";

  document.getElementById("results").innerHTML=
    `Dilated: ${baseline.toFixed(1)} px<br>
     Constricted: ${minVal.toFixed(1)} px<br>
     Constriction: ${constriction.toFixed(1)}%<br>
     Briskness: ${brisk}`;
}
</script>

</body>
</html>
