<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pupil Response</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

video {
  width: 55vw;
  max-width: 220px;
  border-radius: 8px;
}

canvas {
  width: 40vw;
  max-width: 160px;
  margin: 4px;
  border: 1px solid #444;
}

#row {
  display: flex;
}

button {
  margin: 4px;
  padding: 8px;
}

#status {
  font-size: 12px;
  text-align: center;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<div>
  <button onclick="startCamera()">Start</button>
</div>

<div id="row">
  <canvas id="baselineCanvas"></canvas>
  <canvas id="minCanvas"></canvas>
</div>

<div id="status">Tap pupil to begin</div>

<canvas id="hidden" style="display:none;"></canvas>

<script>
let stream;
let clickPoint = null;

async function startCamera() {
  const video = document.getElementById("video");

  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" }
  });

  video.srcObject = stream;

  document.getElementById("status").innerText =
    "Camera ready. Tap pupil.";
}

// capture click
video.addEventListener("click", async (e) => {
  const rect = video.getBoundingClientRect();

  clickPoint = {
    x: (e.clientX - rect.left) * (video.videoWidth / rect.width),
    y: (e.clientY - rect.top) * (video.videoHeight / rect.height)
  };

  document.getElementById("status").innerText = "Measuring...";

  await runTest();
});

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function detectPupil(frame, w, h, cx, cy) {
  const data = frame.data;

  const radiusSearch = 60;
  let sumX=0, sumY=0, count=0;

  for (let y = cy - radiusSearch; y < cy + radiusSearch; y++) {
    for (let x = cx - radiusSearch; x < cx + radiusSearch; x++) {

      if (x<0 || y<0 || x>=w || y>=h) continue;

      const i = (y*w + x)*4;
      const b = (data[i]+data[i+1]+data[i+2])/3;

      if (b < 60) {
        sumX += x;
        sumY += y;
        count++;
      }
    }
  }

  if (count < 50) return null;

  const centerX = sumX/count;
  const centerY = sumY/count;
  const radius = Math.sqrt(count/Math.PI);

  return {cx:centerX, cy:centerY, r:radius};
}

function draw(frame, res, canvas, shade=false) {
  const ctx = canvas.getContext("2d");
  ctx.putImageData(frame,0,0);

  if (!res) return;

  ctx.beginPath();
  ctx.arc(res.cx,res.cy,res.r,0,2*Math.PI);

  if (shade) {
    ctx.fillStyle="rgba(0,255,255,0.3)";
    ctx.fill();
  }

  ctx.strokeStyle="cyan";
  ctx.lineWidth=2;
  ctx.stroke();
}

async function runTest() {

  const video = document.getElementById("video");
  const hidden = document.getElementById("hidden");
  const ctx = hidden.getContext("2d");

  hidden.width = video.videoWidth;
  hidden.height = video.videoHeight;

  let frames = [];
  let values = [];

  // baseline frames
  for (let i=0;i<6;i++){
    ctx.drawImage(video,0,0);
    let f = ctx.getImageData(0,0,hidden.width,hidden.height);
    let res = detectPupil(f,hidden.width,hidden.height,clickPoint.x,clickPoint.y);

    frames.push({f,res});
    values.push(res?res.r:0);

    await sleep(80);
  }

  // flash (screen)
  document.body.style.background="#fff";
  await sleep(200);
  document.body.style.background="#111";

  // response
  for (let i=0;i<15;i++){
    ctx.drawImage(video,0,0);
    let f = ctx.getImageData(0,0,hidden.width,hidden.height);
    let res = detectPupil(f,hidden.width,hidden.height,clickPoint.x,clickPoint.y);

    frames.push({f,res});
    values.push(res?res.r:0);

    await sleep(80);
  }

  let baselineIndex = 0;
  let minIndex = values.indexOf(Math.min(...values));

  draw(frames[baselineIndex].f, frames[baselineIndex].res,
       document.getElementById("baselineCanvas"), false);

  draw(frames[minIndex].f, frames[minIndex].res,
       document.getElementById("minCanvas"), true);

  let baseline = values[baselineIndex];
  let minVal = values[minIndex];

  let constriction = ((baseline - minVal)/baseline)*100;

  document.getElementById("status").innerText =
    `Constriction: ${constriction.toFixed(1)}%`;
}
</script>

</body>
</html>
